name: "redis-starter-go"
services:
  redis:
    image: "redis:alpine"
    ports:
      - 6379:6379
    deploy:
      replicas: 1
      restart_policy:
        condition: unless-stopped
    volumes:
      - redis-data:/data

  server:
    build: .
    ports:
      - "${HOST_PORT:-8081}:${PORT}"
    environment:
      PORT: ${PORT}
    env_file:
      - .env
      - .env.docker
    restart: unless-stopped
    depends_on:
      - redis

volumes:
  redis-data:
